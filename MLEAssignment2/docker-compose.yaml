services:
  fix-perms:
    image: busybox
    user: root
    command: >
      sh -c "chown -R 50000:0 /opt/airflow && chown -R 50000:0 /mlflow && chmod -R 2775 /mlflow"
    volumes:
      - airflow_data:/opt/airflow
      - ./mlflow-data:/mlflow
    restart: "no"

